name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check systems/equipment.js
          node --check systems/keybinds.js
          node --check systems/dialogue.js
          node --check systems/shop.js
          node --check systems/cultivation.js
          node --check multiplayer/arena.js
      - name: Run gameplay smoke tests
        run: |
          node tests/smoke-test.js game.js index.html
          node --test systems/test/*.test.js
          node --test multiplayer/test/client.test.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
